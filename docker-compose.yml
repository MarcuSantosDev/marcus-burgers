services:
  db:
    image: postgres:17
    container_name: marcus-burgers-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: marcus-burgers-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: test # Altere apenas este valor: dev (PostgreSQL) ou test (H2)
      DB_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - h2_data:/root
    depends_on:
      db:
        condition: service_healthy

  backend-test:
    image: maven:3.9-eclipse-temurin-26
    profiles: ["tests"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - maven_repo:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: test
    command: mvn -B test

  frontend:
    build: ./frontend
    container_name: marcus-burgers-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  maven_repo:
  h2_data:
